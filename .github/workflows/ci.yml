name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=wdtest \
            -e MINIO_ROOT_PASSWORD=wdtest-secret \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy in time" >&2
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck web
        run: npm -w @wd/web exec tsc -- --noEmit

      - name: Build web
        run: npm -w @wd/web run build

      - name: Test
        env:
          WD_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
          WD_TEST_S3_ENDPOINT: http://localhost:9000
          WD_TEST_S3_ACCESS_KEY_ID: wdtest
          WD_TEST_S3_SECRET_ACCESS_KEY: wdtest-secret
        run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t worldhealth:ci .

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8787:8787 \
            -e DATABASE_URL=sqlite:/tmp/smoke.db \
            worldhealth:ci \
            sh -c "node packages/ingest/dist/cli.js migrate && node packages/api/dist/server.js"

          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/healthz; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ -z "$ok" ]; then
            echo "container never became healthy" >&2
            docker logs smoke
            exit 1
          fi

          if ! curl -sf http://localhost:8787/ | grep -qi "<html"; then
            echo "root route did not return HTML" >&2
            docker logs smoke
            exit 1
          fi

      - name: Container logs
        if: failure()
        run: docker logs smoke || true
