# Railway config-as-code for the API service (web dashboard + JSON API).
# Point the service at this file: Settings → Config-as-code → railway.api.toml.
# Every value that differs per host lives in the service's variables, never
# here: DATABASE_URL, WD_CACHE_URL, S3_*, FRED_API_KEY, EIA_API_KEY.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node packages/api/dist/server.js"
# Schema changes ship with the code: pending migrations run before the new
# release takes traffic, and a failed migration stops the deploy.
preDeployCommand = ["node packages/ingest/dist/cli.js migrate"]
# Liveness only (DB reachable). /api/health reports on the data and must not
# decide whether a release goes live.
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
