# LOCAL DEVELOPMENT ONLY. Fixed, weak credentials, and every port is bound to
# 127.0.0.1 so nothing here is reachable from another machine even if this file
# is run on a server. Production is Railway (docs/deploy-railway.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: wd
      POSTGRES_DB: wd
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wd"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: quay.io/minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: wdlocal
      MINIO_ROOT_PASSWORD: wdlocal-secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio-data:/data

  s3-init:
    image: quay.io/minio/mc
    depends_on:
      - s3
    entrypoint: >
      sh -c "
        until mc alias set local http://s3:9000 wdlocal wdlocal-secret; do sleep 1; done &&
        mc mb -p local/wd-cache
      "

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:wd@postgres:5432/wd
      WD_CACHE_URL: s3://wd-cache/raw
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY_ID: wdlocal
      S3_SECRET_ACCESS_KEY: wdlocal-secret
      PORT: 8787
    env_file:
      - path: .env.local
        required: false
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node packages/ingest/dist/cli.js migrate && node packages/api/dist/server.js"

  cron:
    build: .
    profiles: ["cron"]
    environment:
      DATABASE_URL: postgres://postgres:wd@postgres:5432/wd
      WD_CACHE_URL: s3://wd-cache/raw
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY_ID: wdlocal
      S3_SECRET_ACCESS_KEY: wdlocal-secret
    env_file:
      - path: .env.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command: node packages/ingest/dist/cli.js daily
    restart: "no"

volumes:
  postgres-data:
  minio-data:
